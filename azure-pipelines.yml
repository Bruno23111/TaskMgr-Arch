trigger:
  branches:
    include:
      - develop
      - main
  paths:
    include:
      - src/**
      - tests/**
      - docs/openapi/**
      - docs/requisitos-funcionais.md
      - scripts/**
      - docker-compose.yml
      - .env.example
      - global.json
      - azure-pipelines.yml

pool:
  vmImage: ubuntu-24.04

variables:
  - name: buildConfiguration
    value: Release
  - name: metricsDirectory
    value: $(Build.SourcesDirectory)/artifacts/metrics
  - name: testResultsDirectory
    value: $(Build.SourcesDirectory)/artifacts/test-results
  - name: publishDirectory
    value: $(Build.ArtifactStagingDirectory)/publish

stages:
  - stage: ValidateAndMeasure
    displayName: Validar e coletar métricas
    jobs:
      - job: BuildTestAndMetrics
        displayName: Build, testes e métricas comparáveis
        steps:
          - checkout: self
            displayName: Obter código e histórico Git completo
            fetchDepth: 0
            fetchTags: false

          - task: UseDotNet@2
            displayName: Instalar .NET SDK 10.0.100
            inputs:
              packageType: sdk
              version: 10.0.100

          - bash: |
              set -euo pipefail
              dotnet restore src/TaskManager.MVC/TaskManager.MVC.sln
              dotnet restore src/TaskManager.CleanArch/TaskManager.CleanArch.sln
              dotnet build src/TaskManager.MVC/TaskManager.MVC.sln --configuration $(buildConfiguration) --no-restore
              dotnet build src/TaskManager.CleanArch/TaskManager.CleanArch.sln --configuration $(buildConfiguration) --no-restore
            displayName: Restaurar e compilar as duas arquiteturas

          - bash: |
              set -euo pipefail
              mkdir -p "$(testResultsDirectory)"
              search_roots=(src)
              [ -d tests ] && search_roots+=(tests)
              mapfile -t test_projects < <(find "${search_roots[@]}" -type f -name '*Tests.csproj' | sort)
              if [ "${#test_projects[@]}" -eq 0 ]; then
                echo "##vso[task.logissue type=warning]Ainda não há projetos de teste. O quality gate completo será habilitado pela User Story #78."
                echo '##vso[task.setvariable variable=hasCoverage]false'
                exit 0
              fi
              test_exit=0
              for project in "${test_projects[@]}"; do
                name="$(basename "$project" .csproj)"
                dotnet test "$project" --configuration $(buildConfiguration) \
                  --logger "trx;LogFileName=${name}.trx" \
                  --results-directory "$(testResultsDirectory)" \
                  --collect "XPlat Code Coverage" || test_exit=$?
              done
              find "$(testResultsDirectory)" -name 'coverage.cobertura.xml' -print -quit | grep -q . && \
                echo '##vso[task.setvariable variable=hasCoverage]true' || \
                echo '##vso[task.setvariable variable=hasCoverage]false'
              exit "$test_exit"
            displayName: Executar testes e coletar cobertura

          - task: PublishTestResults@2
            displayName: Publicar resultados de testes
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: VSTest
              testResultsFiles: '**/*.trx'
              searchFolder: $(testResultsDirectory)
              failTaskOnFailedTests: true
              failTaskOnMissingResultsFile: false

          - bash: |
              set -euo pipefail
              python3 -m pip install --disable-pip-version-check lizard==1.17.10
              python3 scripts/analyze_csharp_metrics.py \
                --source MVC=src/TaskManager.MVC \
                --source CLEAN_ARCH=src/TaskManager.CleanArch \
                --test-source MVC=tests/TaskManager.MVC \
                --test-source CLEAN_ARCH=tests/TaskManager.CleanArch \
                --output "$(metricsDirectory)" \
                --repository "$(Build.SourcesDirectory)"
              echo '##vso[task.setvariable variable=hasMetrics]true'
            displayName: Gerar métricas C# e histórico Git

          - task: PublishCodeCoverageResults@2
            displayName: Publicar cobertura
            condition: and(always(), eq(variables['hasCoverage'], 'true'))
            inputs:
              codeCoverageTool: Cobertura
              summaryFileLocation: $(testResultsDirectory)/**/coverage.cobertura.xml

          - bash: |
              set -euo pipefail
              dotnet publish src/TaskManager.MVC/TaskManager.MVC.API/TaskManager.MVC.API.csproj \
                --configuration $(buildConfiguration) --no-restore --output "$(publishDirectory)/mvc"
              dotnet publish src/TaskManager.CleanArch/TaskManager.CleanArch.WebAPI/TaskManager.CleanArch.WebAPI.csproj \
                --configuration $(buildConfiguration) --no-restore --output "$(publishDirectory)/clean-architecture"
            displayName: Publicar APIs para entrega contínua

          - task: PublishPipelineArtifact@1
            displayName: Publicar artefato de métricas
            condition: and(succeeded(), eq(variables['hasMetrics'], 'true'))
            inputs:
              targetPath: $(metricsDirectory)
              artifact: taskmgr-metrics

          - task: PublishPipelineArtifact@1
            displayName: Publicar APIs compiladas
            condition: succeeded()
            inputs:
              targetPath: $(publishDirectory)
              artifact: taskmgr-apis

  - stage: MirrorToGitHub
    displayName: Espelhar branch no GitHub
    dependsOn: ValidateAndMeasure
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'), in(variables['Build.SourceBranch'], 'refs/heads/develop', 'refs/heads/main'))
    variables:
      - group: taskmgr-github-mirror
    jobs:
      - job: PushBranch
        displayName: Enviar develop ou main ao GitHub
        steps:
          - checkout: self

          - bash: |
              set -euo pipefail
              credentials_file="$HOME/.git-credentials"
              trap 'rm -f "$credentials_file"' EXIT

              printf 'https://x-access-token:%s@github.com\n' "$GITHUB_TOKEN" > "$credentials_file"
              git config --global credential.helper "store --file=$credentials_file"
              git remote add github https://github.com/Bruno23111/TaskMgr-Arch.git
              git push github "HEAD:refs/heads/$(Build.SourceBranchName)"
            displayName: Sincronizar branch validada
            env:
              GITHUB_TOKEN: $(GITHUB_TOKEN)
