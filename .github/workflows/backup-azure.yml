name: Backup no Azure Repos

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: azure-repos-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Sincronizar branches e tags
    runs-on: ubuntu-24.04
    steps:
      - name: Obter repositório completo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Copiar refs do GitHub para o Azure Repos
        shell: bash
        env:
          AZURE_REPOS_BACKUP_PAT: ${{ secrets.AZURE_REPOS_BACKUP_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${AZURE_REPOS_BACKUP_PAT:-}" ]; then
            echo '::error::Configure o secret AZURE_REPOS_BACKUP_PAT com acesso Code (read and write) à organização Azure DevOps.'
            exit 1
          fi

          credentials_file="$RUNNER_TEMP/azure-repos-credentials"
          trap 'rm -f "$credentials_file"' EXIT
          umask 077
          printf 'https://mirror:%s@dev.azure.com\n' "$AZURE_REPOS_BACKUP_PAT" > "$credentials_file"
          unset AZURE_REPOS_BACKUP_PAT

          git fetch origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*' --prune
          azure_url='https://dev.azure.com/bruno23111399/TaskMgr-Arch/_git/TaskMgr-Arch'
          git_config=(-c credential.helper= -c "credential.helper=store --file=$credentials_file")

          while IFS= read -r ref; do
            branch="${ref#refs/remotes/origin/}"
            [ "$branch" = 'HEAD' ] && continue
            git "${git_config[@]}" push "$azure_url" "$ref:refs/heads/github/$branch"
          done < <(git for-each-ref --format='%(refname)' refs/remotes/origin)

          while IFS= read -r ref; do
            tag="${ref#refs/tags/}"
            git "${git_config[@]}" push "$azure_url" "$ref:refs/tags/github/$tag"
          done < <(git for-each-ref --format='%(refname)' refs/tags)
