services:
  # Banco de Dados Central
  db-postgres:
    image: postgres:15-alpine
    container_name: taskmgr-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Defina POSTGRES_USER no arquivo .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
      POSTGRES_DB: ${POSTGRES_DB:-taskmgr}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-postgres-databases.sh:/docker-entrypoint-initdb.d/01-init-databases.sh:ro
    networks:
      - taskmgr-network

  # [Futuro] API MVC
  # api-mvc:
  #   build:
  #     context: ./src/TaskManager.MVC
  #     dockerfile: Dockerfile
  #   ports:
  #     - "5000:80"
  #   ...

  # [Futuro] API Clean Architecture
  # api-clean:
  #   build:
  #     context: ./src/TaskManager.CleanArch
  #     dockerfile: Dockerfile
  #   ports:
  #     - "5001:80"
  #   ...

networks:
  taskmgr-network:
    driver: bridge

volumes:
  postgres_data:
